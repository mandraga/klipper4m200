[gcode_macro M600]
# B: 2   ; Number of beeps to alert user
# X: 50  ; X position for filament change
# Y: 5   ; Y position for filament change
# Z: 10  ; Z relative lift for filament change position
gcode:
   CHANGE_FILAMENT BEEP={params.B|default(2)} X={params.X|default(50)} Y={params.Y|default(5)} Z={params.Z|default(10)}