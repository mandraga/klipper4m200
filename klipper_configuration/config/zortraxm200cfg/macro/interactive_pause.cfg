[gcode_macro INTERACTIVE_PAUSE]
gcode:
   SAVE_GCODE_STATE NAME=M600_state
   PAUSE
   M83
   G91
   G1 E-0.8 F2700
   G1 Z{params.Z|default(0)}
   G90
   G1 X{params.X|default(50)} Y{params.Y|default(5)} F3000
   G91
   G1 E-10 F1800
   BEEP R={params.BEEP|default(0)}
   RESTORE_GCODE_STATE NAME=M600_state