    X_MIN=PE12,
    Y_MIN=PC6,
    Z_MIN=PC7,

    # Steppers
    X_STEP=PB3, X_DIR=PD9, X_ENABLE=PD14,
    X_MS1_PIN=PB10, X_MS2_PIN=PB11, X_MS3_PIN=PD8,

    Y_STEP=PB4, Y_DIR=PD13, Y_ENABLE=PD14,
    Y_MS1_PIN=PD10, Y_MS2_PIN=PD11, Y_MS3_PIN=PD12,

    Z_STEP=PB7, Z_DIR=PC12, Z_ENABLE=PD14,
    Z_MS1_PIN=A15, Z_MS2_PIN=C10, Z_MS3_PIN=C11,

    E0_STEP=PA0, E0_DIR=PD0, E0_ENABLE=PD14,

    #  Heaters / Fans
    HEAT_0=PC8,
    HEAT_BED=PC9,
    FAN0=PE13,
    FAN1=PE14,

    # Temperature Sensors
    TEMP_0=PB1,
    TEMP_BED=PB0,

